name: deploy

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CARGO_TERM_COLOR: always

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false
            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
            - run: cargo fmt --check
            - run: cargo test --release --locked
            - run: cargo run --release --locked -- build
            - name: Deploy
              if: github.event_name == 'push'
              uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  wranglerVersion: "4"
                  command: deploy

            - name: Upload preview
              id: preview
              if: >-
                  github.event_name == 'pull_request' &&
                  github.event.pull_request.head.repo.full_name == github.repository
              uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  wranglerVersion: "4"
                  command: versions upload --preview-alias pr-${{ github.event.number }}

            - name: Comment preview URL
              if: steps.preview.outcome == 'success'
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.number }}
                  DEPLOYMENT_URL: ${{ steps.preview.outputs.deployment-url }}
                  COMMAND_OUTPUT: ${{ steps.preview.outputs.command-output }}
              run: |
                  url=$(printf '%s' "$COMMAND_OUTPUT" \
                    | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' \
                    | grep -m1 "pr-$PR-" || true)
                  [ -n "$url" ] || url="$DEPLOYMENT_URL"
                  [ -n "$url" ] || { echo "no preview URL in wrangler output"; exit 1; }
                  gh pr comment "$PR" --edit-last --create-if-none \
                    --body "Preview: $url (commit ${GITHUB_SHA:0:7})"
